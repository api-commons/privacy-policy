$schema: https://json-schema.org/draft/2020-12/schema
$id: https://raw.githubusercontent.com/api-commons/privacy-policy/main/privacy-policy-json-schema.yml
title: API Commons Privacy Policy
description: >-
  The machine-readable privacy and data-processing posture of an API — whether the provider acts
  as controller or processor, what personal data it handles and why, how long it keeps it, where
  it stores it, how it transfers it, and how a consumer gets a DPA or deletes data. Every value
  is transcribed verbatim from the provider's own pages.
oneOf:
- title: Privacy Policy document
  description: A standalone document, as written to all/<slug>/privacy/.
  type: object
  $ref: '#/$defs/document'
- title: DataProcessing properties
  description: One or more apis.yml property envelopes carrying the document under `data`.
  type: array
  minItems: 1
  items:
    $ref: '#/$defs/property'
$defs:
  verbatim:
    type:
    - string
    - 'null'
    minLength: 1
    description: Copied word for word from the page at `url`. The harvester checks every row against
      the fetched page text and drops any row that does not match. Never paraphrased, never synthetic.
  period:
    type:
    - string
    - 'null'
    description: A period copied exactly as written on the page (for example "30 days" or "12
      months"). Never normalized or computed.
  stance:
    type: string
    enum:
    - allowed
    - prohibited
    - conditional
    - unstated
    description: Whether the page permits something. `allowed`, `prohibited` and `conditional`
      each need a verbatim `text`. `unstated` means the page says nothing about it, which is a
      valid result and is never guessed.
  stanceText:
    type: object
    additionalProperties: false
    required:
    - stance
    description: A permission and the verbatim sentence it was read from.
    properties:
      stance:
        $ref: '#/$defs/stance'
      text:
        $ref: '#/$defs/verbatim'
    if:
      properties:
        stance:
          not:
            const: unstated
    then:
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
  textOnly:
    type: object
    additionalProperties: false
    required:
    - text
    description: A clause that is recorded only as the verbatim text it was read from.
    properties:
      text:
        $ref: '#/$defs/verbatim'
  periodText:
    type: object
    additionalProperties: false
    required:
    - period
    - text
    description: A period and the verbatim sentence that states it.
    properties:
      period:
        $ref: '#/$defs/period'
      text:
        $ref: '#/$defs/verbatim'
  summaryText:
    type: object
    additionalProperties: false
    required:
    - summary
    - text
    description: A short label for a clause plus the verbatim clause itself.
    properties:
      summary:
        type: string
        description: A short label for the clause. The label is ours; the `text` is the provider's.
        minLength: 1
      text:
        type: string
        minLength: 1
        description: Copied word for word from the page at `url`. The harvester checks every row
          against the fetched page text and drops any row that does not match. Never paraphrased,
          never synthetic.
  derivation:
    type: object
    additionalProperties: true
    required:
    - synthetic
    - method
    - read
    - tool
    description: How this document was produced. Every business-layer document is harvested from
      the provider's own page; none is generated.
    properties:
      synthetic:
        const: false
        description: Always false. Synthetic or template-filled documents are not published (roadmap#1086).
      method:
        const: harvested
        description: 'Always `harvested`: the page was fetched by code and the model only transcribed
          rows from it.'
      read:
        type: string
        description: The date the page was read (YYYY-MM-DD).
        format: date
      tool:
        type: string
        description: The harvester that produced the document, e.g. engine/business/harvest-business.py.
      model:
        type: string
        description: The model id that transcribed the rows. The model never authors text; it
          only selects it.
  document:
    type: object
    additionalProperties: false
    required:
    - privacy_policy
    - provider
    - aid
    - url
    - source_date
    - x-apis-io-derivation
    description: A Privacy Policy document as harvested from one provider page.
    properties:
      privacy_policy:
        type: string
        description: 'Schema version of this document. `privacy_policy: 0.1.0` for this release.'
        pattern: ^\d+\.\d+\.\d+$
      provider:
        type: string
        description: The provider's name as it appears in its apis.yml.
        minLength: 1
      aid:
        type: string
        description: The provider's APIs.io slug (the `all/<slug>` directory and page slug).
        pattern: ^[a-z0-9][a-z0-9-]*$
      url:
        type: string
        description: The page this document was read from.
        format: uri
      source_date:
        type: string
        description: When the page was read (YYYY-MM-DD).
        format: date
      x-apis-io-derivation:
        $ref: '#/$defs/derivation'
      role:
        type:
        - object
        - 'null'
        additionalProperties: false
        description: Whether the provider acts as a data controller, processor, or both.
        properties:
          value:
            type: string
            enum:
            - controller
            - processor
            - both
            - unstated
            description: The role the page states.
          text:
            $ref: '#/$defs/verbatim'
        required:
        - value
      data_categories:
        type: array
        description: Personal data categories the page says are collected.
        items:
          type: object
          additionalProperties: false
          required:
          - category
          - text
          properties:
            category:
              type: string
              enum:
              - identifying
              - contact
              - financial
              - location
              - behavioral
              - device
              - health
              - biometric
              - communication
              - professional
              - demographic
              - other
              description: Top-level W3C DPV personal-data category.
            text:
              type: string
              minLength: 1
              description: Copied word for word from the page at `url`. The harvester checks every
                row against the fetched page text and drops any row that does not match. Never
                paraphrased, never synthetic.
      purposes:
        type: array
        description: Purposes of processing.
        items:
          type: object
          additionalProperties: false
          required:
          - purpose
          - text
          properties:
            purpose:
              type: string
              description: A short label for the purpose.
            text:
              type: string
              minLength: 1
              description: Copied word for word from the page at `url`. The harvester checks every
                row against the fetched page text and drops any row that does not match. Never
                paraphrased, never synthetic.
      retention:
        type: array
        description: Retention periods.
        items:
          type: object
          additionalProperties: false
          required:
          - text
          properties:
            scope:
              type:
              - string
              - 'null'
              description: What the retention period applies to.
            period:
              $ref: '#/$defs/period'
            text:
              type: string
              minLength: 1
              description: Copied word for word from the page at `url`. The harvester checks every
                row against the fetched page text and drops any row that does not match. Never
                paraphrased, never synthetic.
      residency:
        type: array
        description: Where data is stored or processed.
        items:
          type: object
          additionalProperties: false
          required:
          - region
          - text
          properties:
            region:
              type: string
              description: The region or country named on the page.
            text:
              type: string
              minLength: 1
              description: Copied word for word from the page at `url`. The harvester checks every
                row against the fetched page text and drops any row that does not match. Never
                paraphrased, never synthetic.
      transfers:
        type: array
        description: International transfer mechanisms.
        items:
          type: object
          additionalProperties: false
          required:
          - mechanism
          - text
          properties:
            mechanism:
              type: string
              enum:
              - SCC
              - adequacy
              - DPF
              - BCR
              - other
              description: 'Cross-border transfer mechanism: Standard Contractual Clauses, an
                adequacy decision, the EU-U.S. Data Privacy Framework, Binding Corporate Rules,
                or other.'
            text:
              type: string
              minLength: 1
              description: Copied word for word from the page at `url`. The harvester checks every
                row against the fetched page text and drops any row that does not match. Never
                paraphrased, never synthetic.
      subprocessors:
        type:
        - object
        - 'null'
        additionalProperties: false
        description: Where the subprocessor list is published.
        properties:
          url:
            type:
            - string
            - 'null'
            format: uri
            description: The subprocessor list.
          text:
            $ref: '#/$defs/verbatim'
      dpa:
        type:
        - object
        - 'null'
        additionalProperties: false
        description: Whether a data processing agreement is available.
        properties:
          available:
            type:
            - boolean
            - 'null'
            description: True when a DPA is offered. `null` when the page does not say.
          url:
            type:
            - string
            - 'null'
            format: uri
            description: Where the DPA is.
          text:
            $ref: '#/$defs/verbatim'
      deletion:
        type:
        - object
        - 'null'
        additionalProperties: false
        description: How a consumer gets data deleted.
        properties:
          route:
            type:
            - string
            - 'null'
            description: The route as the page describes it (an address, a form, a setting).
          text:
            $ref: '#/$defs/verbatim'
      rights:
        type: array
        description: Data-subject rights the page names.
        items:
          type: object
          additionalProperties: false
          required:
          - right
          - text
          properties:
            right:
              type: string
              description: The data-subject right named (e.g. access, rectification, erasure,
                portability, objection).
            text:
              type: string
              minLength: 1
              description: Copied word for word from the page at `url`. The harvester checks every
                row against the fetched page text and drops any row that does not match. Never
                paraphrased, never synthetic.
      sale_or_sharing:
        description: Whether personal data is sold or shared for cross-context advertising.
        anyOf:
        - $ref: '#/$defs/stanceText'
        - type: 'null'
    patternProperties:
      ^x-:
        description: Extensions.
  property:
    type: object
    additionalProperties: false
    required:
    - type
    - url
    - data
    description: The DataProcessing property as it appears inside an apis.yml / apis.json index.
    properties:
      name:
        type: string
        description: The name of the property as it appears in the index.
      type:
        const: DataProcessing
        description: The API Commons property type. Always DataProcessing.
      description:
        type: string
        description: What this property covers.
      url:
        type: string
        description: The artifact path (or provider page) this property points at.
        format: uri-reference
      source_date:
        type: string
        description: The date the data was last verified against the provider page.
        format: date
      data:
        $ref: '#/$defs/document'
